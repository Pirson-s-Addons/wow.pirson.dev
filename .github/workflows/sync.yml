name: Daily data sync

# Every day: catalog texts from the org profile and today's CurseForge downloads into src/data/addons.json.
# A change is committed and pushed, so Vercel rebuilds the site (order by downloads, figures without JS).
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-data.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/data/addons.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily data sync"
            git push
          fi
